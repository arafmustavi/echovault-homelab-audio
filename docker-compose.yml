services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./media:/media
      - ./instance:/data
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/media:ro
    depends_on:
      - app
