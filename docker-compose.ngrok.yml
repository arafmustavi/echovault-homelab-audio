services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./media:/media
      - ./instance:/data
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Keep this if you still want LAN access at http://<host>:8080.
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/media:ro
    depends_on:
      - app

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"   # local traffic-inspection dashboard
    depends_on:
      - nginx
